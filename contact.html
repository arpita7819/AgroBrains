<body>

<nav>
  <a href="index.html" class="logo">🌾 AgroBrains</a>
  <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
  <ul id="nav-links">

<main class="page-wrapper">
  <h2 class="section-title" style="text-align:center">📞 Contact Us</h2>
  <p class="section-sub" style="text-align:center">Have questions or suggestions? We'd love to hear from you!</p>

  <div class="form-card">
    <form onsubmit="submitForm(event)">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g. Arpita Kamboj" required>
      </div>
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" placeholder="e.g. arpita@email.com" required>
      </div>
      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" placeholder="Type your message here..." required></textarea>
      </div>
      <button type="submit" class="submit-btn">Send Message</button>
    </form>
    <div id="form-msg"></div>
  </div>
</main>

<footer>
  <p>© 2026 <span>AgroBrains</span> | Developed by Arpita Kamboj</p>
</footer>

<script src="script.js"></script>
