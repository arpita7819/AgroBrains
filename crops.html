<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroBrains - Crop Advisor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html" class="logo">🌾 AgroBrains</a>
  <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="crops.html">Crop Advisor</a></li>
    <li><a href="weather.html">Weather</a></li>
    <li><a href="market.html">Market</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<main class="page-wrapper">
  <h2 class="section-title" style="text-align:center">🌱 Smart Crop Advisor</h2>
  <p class="section-sub" style="text-align:center">Enter your farm conditions to get a tailored crop recommendation.</p>

  <div class="form-card">
    <div class="form-group">
      <label for="soil">Soil Type</label>
      <select id="soil">
        <option value="">Select Soil</option>
        <option value="black">Black Soil</option>
        <option value="loamy">Loamy Soil</option>
        <option value="sandy">Sandy Soil</option>
      </select>
    </div>

    <div class="form-group">
      <label for="season">Season</label>
      <select id="season">
        <option value="">Select Season</option>
        <option value="summer">Summer</option>
        <option value="winter">Winter</option>
        <option value="rainy">Rainy</option>
      </select>
    </div>

    <div class="form-group">
      <label for="temp">Temperature (°C)</label>
      <input type="number" id="temp" placeholder="e.g. 28" min="-10" max="55">
    </div>

    <div class="form-group">
      <label for="rain">Rainfall (mm)</label>
      <input type="number" id="rain" placeholder="e.g. 120" min="0" max="5000">
    </div>

    <button class="submit-btn" onclick="recommendCrop()">Get Recommendation</button>
  </div>

  <div class="result-box" id="result"></div>
</main>

<footer>
  <p>© 2026 <span>AgroBrains</span> | Developed by Arpita Kamboj</p>
</footer>

<script src="script.js"></script>
</body>
</html>
